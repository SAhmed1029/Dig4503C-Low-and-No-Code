<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Petite Crêperie | Fresh Handmade Crepes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Menu data
        const menuItems = {
            sweet: [
                { id: 1, name: "Classic Nutella", description: "Creamy Nutella spread with fresh strawberries and powdered sugar", price: 9.99, icon: "🍫", popular: true },
                { id: 2, name: "Berry Bliss", description: "Mixed berries, whipped cream, and honey drizzle", price: 10.99, icon: "🍓", popular: false },
                { id: 3, name: "Banana Caramel", description: "Fresh bananas, salted caramel, and crushed almonds", price: 9.99, icon: "🍌", popular: true },
                { id: 4, name: "Lemon Sugar", description: "Fresh lemon juice with a dusting of sweet sugar", price: 7.99, icon: "🍋", popular: false },
                { id: 5, name: "S'mores Dream", description: "Chocolate, toasted marshmallow, and graham cracker crumbs", price: 10.99, icon: "🔥", popular: true },
                { id: 6, name: "Apple Cinnamon", description: "Caramelized apples with warm cinnamon and vanilla ice cream", price: 11.99, icon: "🍎", popular: false },
            ],
            savory: [
                { id: 7, name: "Ham & Cheese", description: "Black forest ham, Swiss cheese, and Dijon mustard", price: 11.99, icon: "🧀", popular: true },
                { id: 8, name: "Spinach Feta", description: "Fresh spinach, feta cheese, and sun-dried tomatoes", price: 10.99, icon: "🥬", popular: false },
                { id: 9, name: "Egg Supreme", description: "Scrambled eggs, bacon, cheddar, and fresh chives", price: 12.99, icon: "🥚", popular: true },
                { id: 10, name: "Mushroom Gruyère", description: "Sautéed mushrooms, Gruyère cheese, and fresh thyme", price: 11.99, icon: "🍄", popular: false },
                { id: 11, name: "Chicken Pesto", description: "Grilled chicken, basil pesto, and mozzarella", price: 13.99, icon: "🐔", popular: false },
                { id: 12, name: "Smoked Salmon", description: "Smoked salmon, cream cheese, capers, and dill", price: 14.99, icon: "🐟", popular: true },
            ],
            drinks: [
                { id: 13, name: "French Press Coffee", description: "Rich, aromatic French roast coffee", price: 3.99, icon: "☕", popular: true },
                { id: 14, name: "Hot Chocolate", description: "Creamy Belgian chocolate topped with whipped cream", price: 4.99, icon: "🍫", popular: false },
                { id: 15, name: "Fresh Orange Juice", description: "Freshly squeezed orange juice", price: 4.99, icon: "🍊", popular: false },
                { id: 16, name: "Lavender Latte", description: "Espresso with steamed milk and lavender syrup", price: 5.99, icon: "💜", popular: true },
                { id: 17, name: "Strawberry Smoothie", description: "Fresh strawberries, yogurt, and honey", price: 6.99, icon: "🍓", popular: false },
                { id: 18, name: "Mint Lemonade", description: "Fresh lemonade with mint and sparkling water", price: 4.99, icon: "🍃", popular: false },
            ]
        };

        // Navbar Component
        function Navbar() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className="navbar" style={{ boxShadow: scrolled ? '0 2px 20px rgba(0,0,0,0.15)' : '0 2px 20px rgba(0,0,0,0.1)' }}>
                    <a href="#home" className="logo">La Petite Crêperie</a>
                    <ul className={`nav-links ${mobileMenuOpen ? 'active' : ''}`}>
                        <li><a href="#home" onClick={() => setMobileMenuOpen(false)}>Home</a></li>
                        <li><a href="#menu" onClick={() => setMobileMenuOpen(false)}>Menu</a></li>
                        <li><a href="#about" onClick={() => setMobileMenuOpen(false)}>About</a></li>
                        <li><a href="#gallery" onClick={() => setMobileMenuOpen(false)}>Gallery</a></li>
                        <li><a href="#location" onClick={() => setMobileMenuOpen(false)}>Visit Us</a></li>
                        <li><a href="#contact" onClick={() => setMobileMenuOpen(false)}>Contact</a></li>
                    </ul>
                    <button className="mobile-menu-btn" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                        {mobileMenuOpen ? '✕' : '☰'}
                    </button>
                </nav>
            );
        }

        // Hero Component
        function Hero() {
            return (
                <section id="home" className="hero">
                    <span className="decoration deco-1">🥞</span>
                    <span className="decoration deco-2">🍓</span>
                    <span className="decoration deco-3">🍫</span>
                    <span className="decoration deco-4">🥐</span>
                    <span className="decoration deco-5">🍳</span>
                    <div className="hero-content">
                        <h1>La Petite Crêperie</h1>
                        <p className="hero-tagline">Handcrafted crepes made with love, served with a smile! ✨</p>
                        <div className="hero-buttons">
                            <a href="#menu" className="btn btn-primary">View Our Menu</a>
                            <a href="#location" className="btn btn-secondary">Find Us</a>
                        </div>
                    </div>
                </section>
            );
        }

        // Menu Component
        function Menu() {
            const [activeTab, setActiveTab] = useState('sweet');

            return (
                <section id="menu" className="menu-section">
                    <h2 className="section-title">Our Menu</h2>
                    <p className="section-subtitle">Fresh ingredients, endless possibilities! 🌟</p>

                    <div className="menu-tabs">
                        <button
                            className={`menu-tab ${activeTab === 'sweet' ? 'active' : ''}`}
                            onClick={() => setActiveTab('sweet')}
                        >
                            🍰 Sweet Crepes
                        </button>
                        <button
                            className={`menu-tab ${activeTab === 'savory' ? 'active' : ''}`}
                            onClick={() => setActiveTab('savory')}
                        >
                            🧀 Savory Crepes
                        </button>
                        <button
                            className={`menu-tab ${activeTab === 'drinks' ? 'active' : ''}`}
                            onClick={() => setActiveTab('drinks')}
                        >
                            ☕ Drinks
                        </button>
                    </div>

                    <div className="menu-grid">
                        {menuItems[activeTab].map(item => (
                            <div key={item.id} className="menu-card">
                                {item.popular && <span className="popular-badge">⭐ Popular</span>}
                                <div className="menu-card-icon">{item.icon}</div>
                                <h3>{item.name}</h3>
                                <p>{item.description}</p>
                                <span className="menu-card-price">${item.price.toFixed(2)}</span>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        // About Component
        function About() {
            return (
                <section id="about" className="about-section">
                    <h2 className="section-title">Our Story</h2>
                    <p className="section-subtitle">A passion for perfect crepes since 2015</p>

                    <div className="about-content">
                        <div className="about-image">
                            👨‍🍳
                        </div>
                        <div className="about-text">
                            <h3>Made with Love & Tradition</h3>
                            <p>
                                Welcome to La Petite Crêperie! We started with a simple dream: to bring the authentic taste of French crêpes to our community. Every crepe we make is crafted with care, using recipes passed down through generations.
                            </p>
                            <p>
                                Our batter is made fresh daily with the finest ingredients – farm-fresh eggs, premium flour, and real butter. Whether you're craving something sweet or savory, we've got the perfect crepe waiting for you!
                            </p>
                            <div className="about-features">
                                <div className="feature-item">
                                    <span className="feature-icon">🥚</span>
                                    <span>Fresh Daily</span>
                                </div>
                                <div className="feature-item">
                                    <span className="feature-icon">🌱</span>
                                    <span>Local Ingredients</span>
                                </div>
                                <div className="feature-item">
                                    <span className="feature-icon">💝</span>
                                    <span>Made with Love</span>
                                </div>
                                <div className="feature-item">
                                    <span className="feature-icon">🇫🇷</span>
                                    <span>Authentic Recipes</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        // Gallery Component
        function Gallery() {
            const galleryItems = ['🥞', '🍓', '🧀', '☕', '🍫', '🥐'];

            return (
                <section id="gallery" className="gallery-section">
                    <h2 className="section-title">Gallery</h2>
                    <p className="section-subtitle">A feast for your eyes! 📸</p>

                    <div className="gallery-grid">
                        {galleryItems.map((item, index) => (
                            <div key={index} className="gallery-item">
                                {item}
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        // Location Component
        function Location() {
            return (
                <section id="location" className="location-section">
                    <h2 className="section-title">Visit Us</h2>
                    <p className="section-subtitle">We can't wait to see you! 🎉</p>

                    <div className="location-content">
                        <div className="location-info">
                            <div className="info-card">
                                <h3>📍 Location</h3>
                                <p>123 Crepe Street<br />Downtown District<br />Orlando, FL 32801</p>
                            </div>
                            <div className="info-card">
                                <h3>🕐 Hours</h3>
                                <div className="hours-grid">
                                    <div className="hours-row">
                                        <span>Monday - Friday</span>
                                        <span>8:00 AM - 9:00 PM</span>
                                    </div>
                                    <div className="hours-row">
                                        <span>Saturday</span>
                                        <span>9:00 AM - 10:00 PM</span>
                                    </div>
                                    <div className="hours-row">
                                        <span>Sunday</span>
                                        <span>9:00 AM - 8:00 PM</span>
                                    </div>
                                </div>
                            </div>
                            <div className="info-card">
                                <h3>📞 Contact</h3>
                                <p>Phone: (407) 555-CREP<br />Email: hello@lapetitecreperie.com</p>
                            </div>
                        </div>
                        <div className="map-placeholder">
                            🗺️
                            <p>Map Location</p>
                        </div>
                    </div>
                </section>
            );
        }

        // Contact Component
        function Contact() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                message: ''
            });
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 3000);
                setFormData({ name: '', email: '', message: '' });
            };

            return (
                <section id="contact" className="contact-section">
                    <h2 className="section-title">Get in Touch</h2>
                    <p className="section-subtitle">Questions, catering, or just want to say hi? 💌</p>

                    <div className="contact-content">
                        <form className="contact-form" onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Your Name</label>
                                <input
                                    type="text"
                                    placeholder="John Doe"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Email Address</label>
                                <input
                                    type="email"
                                    placeholder="john@example.com"
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Your Message</label>
                                <textarea
                                    placeholder="Tell us what's on your mind..."
                                    value={formData.message}
                                    onChange={(e) => setFormData({...formData, message: e.target.value})}
                                    required
                                ></textarea>
                            </div>
                            <button type="submit" className="submit-btn">
                                {submitted ? '✓ Message Sent!' : 'Send Message 🚀'}
                            </button>
                        </form>
                    </div>
                </section>
            );
        }

        // Footer Component
        function Footer() {
            return (
                <footer className="footer">
                    <div className="footer-content">
                        <div className="footer-section">
                            <div className="footer-brand">La Petite Crêperie</div>
                            <p>Bringing joy one crepe at a time since 2015.</p>
                            <div className="social-links">
                                <a href="#" className="social-link">📘</a>
                                <a href="#" className="social-link">📸</a>
                                <a href="#" className="social-link">🐦</a>
                                <a href="#" className="social-link">📌</a>
                            </div>
                        </div>
                        <div className="footer-section">
                            <h4>Quick Links</h4>
                            <a href="#menu">Our Menu</a>
                            <a href="#about">About Us</a>
                            <a href="#gallery">Gallery</a>
                            <a href="#contact">Contact</a>
                        </div>
                        <div className="footer-section">
                            <h4>Hours</h4>
                            <p>Mon-Fri: 8AM - 9PM</p>
                            <p>Sat: 9AM - 10PM</p>
                            <p>Sun: 9AM - 8PM</p>
                        </div>
                        <div className="footer-section">
                            <h4>Contact Us</h4>
                            <p>123 Crepe Street</p>
                            <p>Orlando, FL 32801</p>
                            <p>(407) 555-CREP</p>
                        </div>
                    </div>
                    <div className="footer-bottom">
                        <p>© 2026 La Petite Crêperie. Made with 💖 and lots of Nutella.</p>
                    </div>
                </footer>
            );
        }

        // Main App Component
        function App() {
            useEffect(() => {
                // Scroll animation observer
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

                return () => observer.disconnect();
            }, []);

            return (
                <div>
                    <Navbar />
                    <Hero />
                    <Menu />
                    <About />
                    <Gallery />
                    <Location />
                    <Contact />
                    <Footer />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
